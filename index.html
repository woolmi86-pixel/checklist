<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주원이 체크">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>주원이의 오늘 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6fb; --card:#ffffff; --ink:#5b4a63; --sub:#9a8aa3;
  --pink:#ffd6e8; --pink-d:#ff9cc7; --mint:#cdefe3; --mint-d:#6fcfae;
  --lav:#e3dcff; --lav-d:#a994f0; --yel:#fff1b8; --yel-d:#f5c94a; --sky:#d3ebff; --sky-d:#79bdf0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:linear-gradient(180deg,#fff0f8 0%,#f0f6ff 100%);
  color:var(--ink);min-height:100vh;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
}
.wrap{max-width:980px;margin:0 auto}
header{text-align:center;margin:4px 0 16px}
header h1{font-size:24px;letter-spacing:-.5px}
header p{color:var(--sub);font-size:14px;margin-top:2px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 6px 20px rgba(169,148,240,.14)}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{font-size:18px}
.nav{border:none;background:var(--lav);color:var(--lav-d);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;font-family:inherit}
.nav:active{transform:scale(.92)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--sub);padding:4px 0}
.dow:first-child,.day.sun{color:#ff8fa8}
.dow:last-child,.day.sat{color:var(--sky-d)}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;font-size:14px;position:relative;background:#faf7ff}
.day.empty{background:none}
.day[data-d]{cursor:pointer}
.day.sel:not(.today){outline:3px solid var(--lav-d);outline-offset:-2px}
.day .star{position:absolute;bottom:1px;font-size:9px;line-height:1}
.day.today{background:linear-gradient(135deg,var(--pink-d),#ffb5a7);color:#fff;box-shadow:0 4px 10px rgba(255,156,199,.5);transform:scale(1.06)}
.day.today::after{content:"오늘";position:absolute;top:-7px;font-size:9px;background:var(--yel-d);color:#fff;border-radius:8px;padding:0 5px}
.legend{margin-top:12px;font-size:12px;color:var(--sub);text-align:center}
/* profile */
.profile{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#ffe3f0,#e8e0ff);}
.avatar{flex:0 0 auto;width:92px;height:92px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:58px;box-shadow:0 4px 12px rgba(169,148,240,.25);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.profile h2{font-size:22px}
.profile p{font-size:14px;line-height:1.5;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:3px 10px;border-radius:12px;background:#fff;color:var(--lav-d)}
/* progress */
.today-box{margin-top:16px}
.today-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.today-top h3{font-size:18px}
.count{font-size:14px;color:var(--sub)}
.bar{height:14px;border-radius:10px;background:#f1ebff;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--pink-d),var(--yel-d),var(--mint-d));transition:width .4s}
.msg{margin-top:8px;font-size:14px;text-align:center;min-height:20px;color:var(--lav-d)}
/* list */
ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;cursor:pointer;transition:.2s;user-select:none}
li:nth-child(5n+1){background:var(--pink)}
li:nth-child(5n+2){background:var(--mint)}
li:nth-child(5n+3){background:var(--lav)}
li:nth-child(5n+4){background:var(--yel)}
li:nth-child(5n+5){background:var(--sky)}
li:active{transform:scale(.98)}
.chk{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent;box-shadow:inset 0 0 0 2px rgba(91,74,99,.15);transition:.2s}
li.done .chk{background:var(--mint-d);color:#fff;box-shadow:none;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.emo{font-size:22px}
.txt{flex:1;font-size:17px;word-break:keep-all}
li.done .txt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--pink-d);color:var(--sub)}
li.done{opacity:.72}
.del{border:none;background:rgba(255,255,255,.7);color:var(--sub);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;font-family:inherit}
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1;min-width:0;border:2px dashed var(--lav);border-radius:16px;padding:11px 14px;font-family:inherit;font-size:16px;color:var(--ink);background:#fdfbff;outline:none}
.add input:focus{border-color:var(--lav-d)}
.add button{border:none;border-radius:16px;padding:0 18px;background:var(--lav-d);color:#fff;font-family:inherit;font-size:16px;cursor:pointer}
.reset{display:block;margin:12px auto 0;border:none;background:none;color:var(--sub);font-family:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.main{display:flex;flex-direction:column;gap:0}
@media (max-width:760px){
  body{padding:12px}
  .layout{grid-template-columns:1fr}
  .card{border-radius:22px;padding:16px}
  .avatar{width:80px;height:80px;font-size:50px}
  .profile h2{font-size:20px}
}
/* stars */
.stars{margin-top:16px;background:linear-gradient(135deg,#fff7d6,#ffe8f3)}
.stars-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stars-top h3{font-size:18px}
.total{font-size:30px;line-height:1;color:#f0a81c}
.total small{font-size:14px;color:var(--sub);margin-left:2px}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:#fff;border-radius:16px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--lav-d)}
.stat span{font-size:12px;color:var(--sub)}
.goal{margin-top:12px;font-size:13px;color:var(--sub);text-align:center}
.slots{display:flex;justify-content:center;gap:4px;margin-top:6px;font-size:22px;flex-wrap:wrap}
.slots i{font-style:normal;filter:grayscale(1);opacity:.3}
.slots i.on{filter:none;opacity:1}
.shelf{margin-top:12px;background:#fff;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:2px;font-size:20px;line-height:1.2;max-height:150px;overflow:auto;min-height:44px;align-items:center;justify-content:center}
.shelf .empty{font-size:13px;color:var(--sub)}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-120px);background:#fff;color:var(--ink);border-radius:22px;padding:12px 20px;font-size:17px;box-shadow:0 8px 24px rgba(169,148,240,.35);z-index:20;transition:transform .45s cubic-bezier(.2,1.4,.4,1);text-align:center;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.hint{margin-top:8px;font-size:12px;color:var(--sub);text-align:center}
li{position:relative}
.grip{flex:0 0 auto;cursor:grab;touch-action:none;font-size:20px;line-height:1;color:rgba(91,74,99,.5);padding:6px 4px 6px 8px;margin-left:2px}
li.dragging{transition:none!important;box-shadow:0 10px 24px rgba(91,74,99,.25);transform:scale(1.025);z-index:5;opacity:1!important}
li.dragging .grip{cursor:grabbing}
.avatar{border:none;padding:0;cursor:pointer;position:relative;font-family:inherit;overflow:visible}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(169,148,240,.4);font-size:14px;display:flex;align-items:center;justify-content:center}
.photo-reset{margin-top:8px;border:none;background:none;color:var(--sub);font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
[hidden]{display:none!important}

.confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:fall 2.2s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌈 주원이의 하루 체크리스트</h1>
    <p id="dateText"></p>
  </header>

  <div class="layout">
    <!-- 왼쪽: 캘린더 -->
    <section class="card" aria-label="캘린더">
      <div class="cal-head">
        <button class="nav" id="prev" aria-label="이전 달">‹</button>
        <h2 id="monthTitle"></h2>
        <button class="nav" id="next" aria-label="다음 달">›</button>
      </div>
      <div class="grid" id="cal"></div>
      <p class="legend">⭐ = 체크리스트를 다 끝낸 날 · 날짜를 누르면 그날 할 일이 보여요</p>
    </section>

    <!-- 오른쪽: 소개 + 체크리스트 -->
    <div class="main">
      <section class="card profile">
        <button class="avatar" id="avatar" type="button" aria-label="프로필 사진 바꾸기"><span id="avatarEmoji">👦🏻</span><img id="avatarImg" alt="주원이 사진" hidden><span class="cam" aria-hidden="true">📷</span></button>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <div>
          <h2>안녕! 나는 주원이야 👋</h2>
          <p>체스를 좋아하는 씩씩한 어린이예요.<br>오늘 할 일도 하나씩 해낼 거예요!</p>
          <div class="tags"><span class="tag">♟️ 체스</span><span class="tag">💪 씩씩함</span><span class="tag">✨ 오늘도 화이팅</span></div>
          <button class="photo-reset" id="photoReset" type="button" hidden>이모지로 되돌리기</button>
        </div>
      </section>


      <section class="card stars" aria-label="내 별 모음">
        <div class="stars-top">
          <h3>⭐ 내 별 모음</h3>
          <div class="total"><span id="starTotal">0</span><small>개</small></div>
        </div>
        <div class="stats">
          <div class="stat"><b id="starMonth">0</b><span>이번 달</span></div>
          <div class="stat"><b id="starStreak">0</b><span>연속 🔥</span></div>
          <div class="stat"><b id="starNext">10</b><span>다음 🎁까지</span></div>
        </div>
        <p class="goal">별 10개를 모을 때마다 🎁 큰 보상!</p>
        <div class="slots" id="slots"></div>
        <div class="shelf" id="shelf"></div>
      </section>

      <section class="card today-box">
        <div class="today-top">
          <h3 id="listTitle">📝 오늘 해야 할 일</h3>
          <span class="count" id="count"></span>
        </div>
        <div class="bar"><i id="bar"></i></div>
        <p class="msg" id="msg"></p>
        <ul id="list"></ul>
        <p class="hint">⠿ 를 잡고 위아래로 끌어서 순서를 바꿀 수 있어요</p>
        <form class="add" id="addForm">
          <input id="newItem" type="text" placeholder="이 날 할 일 추가하기" maxlength="30" autocomplete="off">
          <button type="submit">추가</button>
        </form>
        <button class="reset" id="reset" type="button">이 날 체크 모두 지우기</button>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
  // 요일별 스케줄 (0=일 ... 6=토)
  var COMMON=[{e:'🧮',t:'원리셈 1일치 하기'},{e:'📒',t:'디딤돌 1일치 하기'}];
  var MORNING=[{id:'m0',e:'😊',t:'기분 좋게 일어나기'},{id:'m1',e:'🍚',t:'맛있게 아침 먹기'},{id:'m2',e:'🪥',t:'깨끗이 양치하고 세수하기'},{id:'m5',e:'🧦',t:'스스로 옷 입고 양말 신기'},{id:'m3',e:'🎒',t:'준비물이나 가방 챙기기'},{id:'m4',e:'🏫',t:'즐겁게 학교 가기'}];
  var WEEKDAY_TAIL=[{e:'💻',t:'E-Poly 하기'},{e:'📗',t:'영어책 1권 읽기'}];
  var WEEKEND_TAIL=[{e:'🔤',t:'5words 하기'}];
  var SCHEDULE={
    1:[{e:'🎹',t:'피아노'},{e:'🏊',t:'수영'},{e:'🅰️',t:'폴리영어학원 가기'}].concat(COMMON,WEEKDAY_TAIL),
    2:[{e:'🎹',t:'피아노'},{e:'⚽',t:'축구학원 가기'}].concat(COMMON,WEEKDAY_TAIL),
    3:[{e:'🈶',t:'한자'},{e:'🅰️',t:'폴리영어학원 가기'}].concat(COMMON,WEEKDAY_TAIL),
    4:[{e:'🪢',t:'음악줄넘기'},{e:'⚽',t:'축구학원 가기'}].concat(COMMON,WEEKDAY_TAIL),
    5:[{e:'🏅',t:'뉴스포츠'},{e:'🅰️',t:'폴리영어학원 가기'}].concat(COMMON,WEEKDAY_TAIL),
    6:[{e:'🎮',t:'★닌텐도 2시간하기★'}].concat(WEEKEND_TAIL,COMMON,[{e:'✏️',t:'일기쓰기'}]),
    0:[{e:'🎮',t:'★닌텐도 2시간하기★'}].concat(WEEKEND_TAIL,COMMON,[{e:'✏️',t:'일기쓰기'}])
  };
  var K_EXTRA='jowon_extra_v2', K_DONE='jowon_done_v2', K_STARS='jowon_stars_v3', K_ORDER='jowon_order_v1';
  function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var extra=load(K_EXTRA,{});   // {'2026-11-20':[{id,e,t}]}  그날에만 추가한 할 일
  var done=load(K_DONE,{});     // {'2026-11-20':['w5-0',...]}
  var order=load(K_ORDER,{});   // 요일별 순서 {5:['m0','w5-0',...]}
  var stars=load(K_STARS,{});   // {'2026-11-20':1} 모두 끝낸 날 = 별 1개
  var DOW=['일','월','화','수','목','금','토'];
  var now=new Date();
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var view=new Date(today.getFullYear(),today.getMonth(),1);
  var sel=new Date(today.getTime());
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  var tk=key(today);
  document.getElementById('dateText').textContent=today.getFullYear()+'년 '+(today.getMonth()+1)+'월 '+today.getDate()+'일 '+DOW[today.getDay()]+'요일';

  function itemsFor(d){
    var dow=d.getDay();
    var base=SCHEDULE[dow].map(function(x,i){return{id:'w'+dow+'-'+i,e:x.e,t:x.t}});
    var pre=(dow>=1&&dow<=5)?MORNING:[];   // 월~금 공통 아침 루틴
    var all=pre.concat(base,extra[key(d)]||[]), ord=order[dow];
    if(ord&&ord.length){
      var pos=function(it){var i=ord.indexOf(it.id);return i<0?9999:i};
      all=all.map(function(it,i){return{it:it,i:i}}).sort(function(a,b){return (pos(a.it)-pos(b.it))||(a.i-b.i)}).map(function(x){return x.it});
    }
    return all;
  }
  function isAllDone(d){
    var k=key(d), arr=done[k]||[], its=itemsFor(d);
    return its.length>0 && its.every(function(it){return arr.indexOf(it.id)>-1});
  }

  function sKeys(){return Object.keys(stars).sort()}
  function renderStars(){
    var ks=sKeys(), total=ks.length, ym=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
    var month=ks.filter(function(k){return k.indexOf(ym)===0}).length;
    var streak=0, c=new Date(today.getTime());
    if(!stars[key(c)]) c.setDate(c.getDate()-1);
    while(stars[key(c)]){streak++; c.setDate(c.getDate()-1)}
    var inCycle=total%10;
    document.getElementById('starTotal').textContent=total;
    document.getElementById('starMonth').textContent=month;
    document.getElementById('starStreak').textContent=streak;
    document.getElementById('starNext').textContent=10-inCycle;
    var sl=''; for(var i=0;i<10;i++) sl+='<i class="'+(i<inCycle?'on':'')+'">⭐</i>';
    document.getElementById('slots').innerHTML=sl;
    var sh=document.getElementById('shelf');
    if(!total){sh.innerHTML='<span class="empty">할 일을 모두 끝내면 별이 생겨요!</span>'}
    else{var n=Math.min(total,120); sh.textContent=new Array(n+1).join('⭐')+(total>n?' +'+(total-n):'')}
  }
  function toast(m){
    var t=document.getElementById('toast');
    if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}
    t.textContent=m; void t.offsetWidth; t.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show')},2800);
  }
  function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  Object.keys(done).forEach(function(k){var d=parseKey(k); if(d<=today&&done[k].length&&isAllDone(d))stars[k]=1}); save(K_STARS,stars);
  function renderCal(){
    var y=view.getFullYear(), m=view.getMonth();
    document.getElementById('monthTitle').textContent=y+'년 '+(m+1)+'월';
    var html=DOW.map(function(d){return '<div class="dow">'+d+'</div>'}).join('');
    var first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
    for(var i=0;i<first;i++) html+='<div class="day empty"></div>';
    for(var d=1;d<=last;d++){
      var dt=new Date(y,m,d), k=key(dt), cls='day';
      if(dt.getDay()===0)cls+=' sun'; if(dt.getDay()===6)cls+=' sat';
      if(k===tk)cls+=' today';
      if(k===key(sel))cls+=' sel';
      var star=stars[k]?'<span class="star">⭐</span>':'';
      html+='<div class="'+cls+'" data-d="'+k+'">'+d+star+'</div>';
    }
    var cal=document.getElementById('cal'); cal.innerHTML=html;
    Array.prototype.forEach.call(cal.querySelectorAll('.day[data-d]'),function(el){
      el.addEventListener('click',function(){
        var p=el.getAttribute('data-d').split('-');
        sel=new Date(+p[0],+p[1]-1,+p[2]); renderAll();
      });
    });
  }
  function renderList(){
    var sk=key(sel), arr=done[sk]||[], its=itemsFor(sel);
    var isToday=sk===tk;
    document.getElementById('listTitle').textContent=isToday?'📝 오늘 해야 할 일 ('+DOW[sel.getDay()]+')':'📝 '+(sel.getMonth()+1)+'월 '+sel.getDate()+'일('+DOW[sel.getDay()]+') 할 일';
    var ul=document.getElementById('list'); ul.innerHTML='';
    its.forEach(function(it){
      var li=document.createElement('li');
      if(arr.indexOf(it.id)>-1)li.className='done';
      li.innerHTML='<span class="chk">✓</span><span class="emo"></span><span class="txt"></span>';
      li.querySelector('.emo').textContent=it.e||'🌟';
      li.querySelector('.txt').textContent=it.t;
      li.dataset.id=it.id;
      var grip=document.createElement('span');grip.className='grip';grip.textContent='⠿';grip.setAttribute('aria-label','끌어서 순서 바꾸기');
      grip.addEventListener('click',function(ev){ev.stopPropagation()});
      grip.addEventListener('pointerdown',function(e){
        e.preventDefault();e.stopPropagation();
        var lis=Array.prototype.slice.call(ul.children), idx=lis.indexOf(li);
        var startY=e.clientY, startScroll=window.scrollY, hLi=li.offsetHeight+10;
        var mids=lis.map(function(x){var r=x.getBoundingClientRect();return r.top+r.height/2});
        var target=idx;
        li.classList.add('dragging');
        lis.forEach(function(x){if(x!==li)x.style.transition='transform .15s'});
        var lastY=startY;
        function apply(){
          var dy=(lastY-startY)+(window.scrollY-startScroll);
          li.style.transform='translateY('+dy+'px) scale(1.025)';
          var c=mids[idx]+dy, t=0;
          for(var j=0;j<lis.length;j++){ if(j!==idx&&mids[j]<c)t++; }
          target=t;
          lis.forEach(function(x,j){
            if(j===idx)return;
            var sh=0;
            if(target>idx&&j>idx&&j<=target)sh=-hLi;
            if(target<idx&&j>=target&&j<idx)sh=hLi;
            x.style.transform=sh?'translateY('+sh+'px)':'';
          });
        }
        function move(ev){
          lastY=ev.clientY;
          if(ev.clientY<70)window.scrollBy(0,-14); else if(ev.clientY>window.innerHeight-70)window.scrollBy(0,14);
          apply();
        }
        function end(){
          document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);
          var ids=lis.map(function(x){return x.dataset.id}); ids.splice(idx,1); ids.splice(target,0,li.dataset.id);
          order[sel.getDay()]=ids; save(K_ORDER,order); renderAll();
        }
        document.addEventListener('pointermove',move);document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
      });
      li.appendChild(grip);
      if(String(it.id).charAt(0)==='u'){
        var b=document.createElement('button');b.className='del';b.textContent='✕';b.setAttribute('aria-label','삭제');
        b.addEventListener('click',function(ev){ev.stopPropagation();extra[sk]=(extra[sk]||[]).filter(function(x){return x.id!==it.id});save(K_EXTRA,extra);renderAll()});
        li.appendChild(b);
      }
      li.addEventListener('click',function(){toggle(it.id)});
      ul.appendChild(li);
    });
    var n=its.filter(function(it){return arr.indexOf(it.id)>-1}).length, total=its.length;
    document.getElementById('count').textContent=n+' / '+total+' 완료';
    document.getElementById('bar').style.width=(total?n/total*100:0)+'%';
    document.getElementById('msg').textContent=n===0?'하나씩 눌러서 체크해 봐요! 💪':(n===total&&total>0?'🎉 할 일을 모두 끝냈어요! 최고예요!':'좋아요! 조금만 더 힘내요 😊');
  }
  function toggle(id){
    if(sel>today){toast('아직 오지 않은 날이에요 🙂');return}
    var sk=key(sel), arr=(done[sk]||[]).slice(), i=arr.indexOf(id), had=!!stars[sk];
    if(i>-1)arr.splice(i,1); else arr.push(id);
    done[sk]=arr; save(K_DONE,done);
    var all=isAllDone(sel);
    if(all&&!had){stars[sk]=1}
    else if(!all&&had){delete stars[sk]}
    save(K_STARS,stars); renderAll();
    if(all&&!had){confetti(); toast('⭐ 별 1개 획득! 지금까지 '+Object.keys(stars).length+'개'+(Object.keys(stars).length%10===0?' 🎁 보상 달성!':''))}
  }
  function confetti(){
    var em=['🎉','⭐','🌸','💖','✨','🍭'];
    for(var i=0;i<24;i++){(function(i){
      var s=document.createElement('span');s.className='confetti';
      s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';
      s.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(s);setTimeout(function(){s.remove()},3200);
    })(i)}
  }
  function renderAll(){renderList();renderCal();renderStars()}
  document.getElementById('prev').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};
  document.getElementById('next').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};
  document.getElementById('addForm').addEventListener('submit',function(ev){
    ev.preventDefault();
    var inp=document.getElementById('newItem'), v=inp.value.trim(); if(!v)return;
    var sk=key(sel); (extra[sk]=extra[sk]||[]).push({id:'u'+Date.now(),e:'🌟',t:v}); save(K_EXTRA,extra);
    inp.value=''; renderAll();
  });
  document.getElementById('reset').onclick=function(){if(sel>today)return;var k=key(sel);done[k]=[];delete stars[k];save(K_DONE,done);save(K_STARS,stars);renderAll()};
  renderAll();
})();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
(function(){
  var K='jowon_photo_v1', avatar=document.getElementById('avatar'), img=document.getElementById('avatarImg'),
      emo=document.getElementById('avatarEmoji'), input=document.getElementById('photoInput'), reset=document.getElementById('photoReset');
  function show(src){
    if(src){img.src=src;img.hidden=false;emo.hidden=true;reset.hidden=false}
    else{img.removeAttribute('src');img.hidden=true;emo.hidden=false;reset.hidden=true}
  }
  try{show(localStorage.getItem(K))}catch(e){show(null)}
  avatar.addEventListener('click',function(){input.click()});
  input.addEventListener('change',function(){
    var f=input.files&&input.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var S=320,c=document.createElement('canvas');c.width=c.height=S;
        var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
        c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,S,S);
        var url=c.toDataURL('image/jpeg',0.85);
        try{localStorage.setItem(K,url)}catch(e){}
        show(url);
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f); input.value='';
  });
  reset.addEventListener('click',function(){try{localStorage.removeItem(K)}catch(e){} show(null)});
})();
</script>
